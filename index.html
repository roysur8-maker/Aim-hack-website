<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR GAMER - Professional Proxy Portal</title>
    <style>
        :root {
            --bg-color: #080a0f;
            --card-bg: #121620;
            --accent-red: #ff1e42;
            --accent-red-hover: #e01638;
            --text-main: #f0f3f6;
            --text-muted: #8b949e;
            --border-color: #21283b;
            --success-color: #2ea043;
            --glow-color: rgba(255, 30, 66, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            background-image: radial-gradient(circle at 50% 0%, #1a1025 0%, var(--bg-color) 70%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px var(--glow-color);
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 4px;
            font-style: italic;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--accent-red);
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="password"], input[type="text"], textarea {
            width: 100%;
            padding: 14px 16px;
            background-color: #080a0f;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px var(--glow-color);
        }

        .toggle-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .toggle-btn:hover {
            color: var(--text-main);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .btn-primary {
            background-color: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 4px 15px var(--glow-color);
        }

        .btn-primary:hover {
            background-color: var(--accent-red-hover);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .btn-secondary {
            background-color: #1a2233;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #222c42;
        }

        .hidden {
            display: none !important;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: rgba(46, 160, 67, 0.12);
            color: var(--success-color);
            border: 1px solid rgba(46, 160, 67, 0.3);
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success-color);
        }

        .info-card {
            background-color: #080a0f;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .info-title {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
        }

        .action-links {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .action-link-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background-color: #080a0f;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: border-color 0.2s;
        }

        .action-link-btn:hover {
            border-color: var(--accent-red);
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1a2233;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        .logout-link {
            display: block;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 20px;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 600;
        }

        .logout-link:hover {
            color: var(--text-main);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
            font-family: monospace;
            font-size: 12px;
        }

        .key-list {
            max-height: 110px;
            overflow-y: auto;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            background-color: #080a0f;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid #1a2233;
            font-size: 13px;
        }

        .key-item:last-child {
            border-bottom: none;
        }

        .del-btn {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .admin-nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: #080a0f;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .tab-btn.active {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="loginView">
            <div class="header">
                <div class="brand-title">SR GAMER</div>
                <div class="brand-subtitle">SECURE PORTAL</div>
            </div>

            <div class="form-group">
                <label for="accessKey">ACCESS KEY</label>
                <div class="input-wrapper">
                    <input type="password" id="accessKey" placeholder="Enter Access Key">
                    <button type="button" class="toggle-btn" id="toggleKeyBtn" onclick="toggleKeyVisibility()">SHOW</button>
                </div>
            </div>

            <button class="btn btn-primary" onclick="handleLogin()">LOGIN TO PORTAL</button>
        </div>

        <!-- USER DASHBOARD SECTION -->
        <div id="userView" class="hidden">
            <div class="header">
                <div class="brand-title">SR GAMER</div>
                <div class="brand-subtitle">USER DASHBOARD</div>
            </div>

            <div style="text-align: center;">
                <div class="status-badge">
                    <div class="status-dot"></div>
                    SYSTEM ONLINE & SECURE
                </div>
            </div>

            <div class="info-card">
                <div class="info-title">ACTIVE SESSION KEY</div>
                <div class="info-value" id="userKeyDisplay">SR-GAMER</div>
            </div>

            <button class="btn btn-primary" onclick="openHappApp()">OPEN IN HAPP APP</button>

            <div class="action-links">
                <a id="userTelegramBtn" href="#" target="_blank" class="action-link-btn">JOIN TELEGRAM</a>
                <a id="userGetKeyBtn" href="#" target="_blank" class="action-link-btn">GET KEY / SUPPORT</a>
            </div>

            <a class="logout-link" onclick="logout()">LOGOUT SESSION</a>
        </div>

        <!-- ADMIN PANEL SECTION -->
        <div id="adminView" class="hidden">
            <div class="header">
                <div class="brand-title">SR GAMER</div>
                <div class="brand-subtitle">ADMIN CONTROL PANEL</div>
            </div>

            <div class="admin-nav-tabs">
                <button class="tab-btn active" id="tabConfigBtn" onclick="switchAdminTab('config')">Config</button>
                <button class="tab-btn" id="tabKeysBtn" onclick="switchAdminTab('keys')">Keys</button>
                <button class="tab-btn" id="tabSettingsBtn" onclick="switchAdminTab('settings')">Settings</button>
            </div>

            <!-- Tab 1: Config Editor -->
            <div id="adminConfigTab" class="admin-tab-content">
                <div class="form-group">
                    <label>HAPP JSON CONFIGURATION</label>
                    <textarea id="jsonConfigInput" placeholder="Paste Happ JSON Code here..."></textarea>
                    <button class="btn btn-primary" style="margin-top: 8px;" onclick="saveJsonConfig()">SAVE CONFIG PERMANENTLY</button>
                </div>
            </div>

            <!-- Tab 2: Keys Manager -->
            <div id="adminKeysTab" class="admin-tab-content hidden">
                <div class="form-group">
                    <label>ACTIVE LICENSE KEYS</label>
                    <div class="key-list" id="keyListDisplay"></div>
                    
                    <div class="input-wrapper" style="margin-top: 10px;">
                        <input type="text" id="newKeyInput" placeholder="Enter New License Key">
                    </div>
                    <button class="btn btn-secondary" onclick="addNewKey()">ADD KEY</button>
                </div>
            </div>

            <!-- Tab 3: Settings / Links -->
            <div id="adminSettingsTab" class="admin-tab-content hidden">
                <div class="form-group">
                    <label>TELEGRAM CHANNEL LINK</label>
                    <input type="text" id="adminTelegramInput" placeholder="https://t.me/your_channel">
                </div>
                <div class="form-group">
                    <label>GET KEY / MOBILE SUPPORT LINK</label>
                    <input type="text" id="adminGetKeyInput" placeholder="https://t.me/your_bot or website">
                </div>
                <button class="btn btn-primary" onclick="saveAdminSettings()">SAVE SETTINGS</button>
            </div>

            <a class="logout-link" onclick="logout()" style="margin-top: 15px;">LOGOUT ADMIN</a>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const DEFAULT_KEYS = ["SR-GAMER"];
        const ADMIN_KEY = "ADMIN-SR-GAMER";
        
        const DEFAULT_JSON = {
            "remarks": "SR GAMER",
            "inbounds": [{
                "tag": "socks",
                "listen": "127.0.0.1",
                "port": 10808,
                "protocol": "socks",
                "settings": { "auth": "noauth", "udp": true }
            }]
        };

        if (!localStorage.getItem("sr_user_keys")) {
            localStorage.setItem("sr_user_keys", JSON.stringify(DEFAULT_KEYS));
        }
        if (!localStorage.getItem("sr_happ_config")) {
            localStorage.setItem("sr_happ_config", JSON.stringify(DEFAULT_JSON));
        }
        if (!localStorage.getItem("sr_telegram_link")) {
            localStorage.setItem("sr_telegram_link", "https://t.me/");
        }
        if (!localStorage.getItem("sr_getkey_link")) {
            localStorage.setItem("sr_getkey_link", "https://t.me/");
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        function toggleKeyVisibility() {
            const input = document.getElementById("accessKey");
            const btn = document.getElementById("toggleKeyBtn");
            if (input.type === "password") {
                input.type = "text";
                btn.innerText = "HIDE";
            } else {
                input.type = "password";
                btn.innerText = "SHOW";
            }
        }

        function handleLogin() {
            const keyInput = document.getElementById("accessKey").value.trim();
            const userKeys = JSON.parse(localStorage.getItem("sr_user_keys"));

            if (keyInput === ADMIN_KEY) {
                document.getElementById("loginView").classList.add("hidden");
                document.getElementById("adminView").classList.remove("hidden");
                loadAdminData();
                showToast("Welcome Admin Panel");
            } else if (userKeys.includes(keyInput)) {
                document.getElementById("loginView").classList.add("hidden");
                document.getElementById("userView").classList.remove("hidden");
                document.getElementById("userKeyDisplay").innerText = keyInput;
                loadUserLinks();
                showToast("Access Granted");
            } else {
                showToast("Invalid Access Key!");
            }
        }

        function logout() {
            document.getElementById("accessKey").value = "";
            document.getElementById("loginView").classList.remove("hidden");
            document.getElementById("userView").classList.add("hidden");
            document.getElementById("adminView").classList.add("hidden");
            showToast("Logged Out");
        }

        function openHappApp() {
            const jsonConfig = localStorage.getItem("sr_happ_config");
            if (!jsonConfig) {
                showToast("No configuration found!");
                return;
            }

            const cleanJson = jsonConfig.trim();
            
            // Auto copy config to Clipboard for Happ app instant prompt
            if (navigator.clipboard) {
                navigator.clipboard.writeText(cleanJson).catch(() => {});
            }

            // Encode to Base64 & URI format for Happ Proxy App Deep-Link protocol
            try {
                const b64Data = btoa(unescape(encodeURIComponent(cleanJson)));
                const happDeepLink = "happ://import?data=" + encodeURIComponent(b64Data);
                
                showToast("Launching Happ App...");
                
                // Trigger scheme
                window.location.href = happDeepLink;

                // Fallback attempt to open app intent
                setTimeout(() => {
                    window.location.href = "happ://add/" + encodeURIComponent(b64Data);
                }, 800);
            } catch (e) {
                window.location.href = "happ://import?data=" + encodeURIComponent(cleanJson);
            }
        }

        function loadUserLinks() {
            const tgLink = localStorage.getItem("sr_telegram_link") || "#";
            const getKeyLink = localStorage.getItem("sr_getkey_link") || "#";
            document.getElementById("userTelegramBtn").href = tgLink;
            document.getElementById("userGetKeyBtn").href = getKeyLink;
        }

        function switchAdminTab(tabName) {
            document.getElementById("adminConfigTab").classList.add("hidden");
            document.getElementById("adminKeysTab").classList.add("hidden");
            document.getElementById("adminSettingsTab").classList.add("hidden");

            document.getElementById("tabConfigBtn").classList.remove("active");
            document.getElementById("tabKeysBtn").classList.remove("active");
            document.getElementById("tabSettingsBtn").classList.remove("active");

            if (tabName === 'config') {
                document.getElementById("adminConfigTab").classList.remove("hidden");
                document.getElementById("tabConfigBtn").classList.add("active");
            } else if (tabName === 'keys') {
                document.getElementById("adminKeysTab").classList.remove("hidden");
                document.getElementById("tabKeysBtn").classList.add("active");
                renderKeyList();
            } else if (tabName === 'settings') {
                document.getElementById("adminSettingsTab").classList.remove("hidden");
                document.getElementById("tabSettingsBtn").classList.add("active");
                loadAdminSettingsData();
            }
        }

        function loadAdminData() {
            document.getElementById("jsonConfigInput").value = localStorage.getItem("sr_happ_config");
            renderKeyList();
            loadAdminSettingsData();
        }

        function loadAdminSettingsData() {
            document.getElementById("adminTelegramInput").value = localStorage.getItem("sr_telegram_link") || "";
            document.getElementById("adminGetKeyInput").value = localStorage.getItem("sr_getkey_link") || "";
        }

        function saveJsonConfig() {
            const inputVal = document.getElementById("jsonConfigInput").value.trim();
            try {
                JSON.parse(inputVal);
                localStorage.setItem("sr_happ_config", inputVal);
                showToast("JSON Config Saved Successfully!");
            } catch (e) {
                showToast("Invalid JSON Format!");
            }
        }

        function saveAdminSettings() {
            const tg = document.getElementById("adminTelegramInput").value.trim();
            const gk = document.getElementById("adminGetKeyInput").value.trim();
            localStorage.setItem("sr_telegram_link", tg);
            localStorage.setItem("sr_getkey_link", gk);
            showToast("Settings Saved Successfully!");
        }

        function renderKeyList() {
            const userKeys = JSON.parse(localStorage.getItem("sr_user_keys"));
            const container = document.getElementById("keyListDisplay");
            container.innerHTML = "";

            userKeys.forEach((key, index) => {
                const item = document.createElement("div");
                item.className = "key-item";
                item.innerHTML = `
                    <span>${key}</span>
                    <button class="del-btn" onclick="deleteKey(${index})">REMOVE</button>
                `;
                container.appendChild(item);
            });
        }

        function addNewKey() {
            const newKey = document.getElementById("newKeyInput").value.trim();
            if (!newKey) return;

            const userKeys = JSON.parse(localStorage.getItem("sr_user_keys"));
            if (userKeys.includes(newKey) || newKey === ADMIN_KEY) {
                showToast("Key already exists!");
                return;
            }

            userKeys.push(newKey);
            localStorage.setItem("sr_user_keys", JSON.stringify(userKeys));
            document.getElementById("newKeyInput").value = "";
            renderKeyList();
            showToast("Key Added!");
        }

        function deleteKey(index) {
            const userKeys = JSON.parse(localStorage.getItem("sr_user_keys"));
            userKeys.splice(index, 1);
            localStorage.setItem("sr_user_keys", JSON.stringify(userKeys));
            renderKeyList();
            showToast("Key Removed!");
        }
    </script>
</body>
</html>
